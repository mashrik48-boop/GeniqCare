<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GeniqCare</title>
<style>
  :root { --bg:#0f1115; --card:#171a20; --ink:#f2f2f3; --sub:#9aa0a8; --accent:#00c2d1; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f4f6f6; --card:#ffffff; --ink:#12251d; --sub:#5b6b62; --accent:#00c2d1; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; display:flex; align-items:center; justify-content:center; padding:24px; }
  .wrap { max-width: 420px; width:100%; }
  h1 { font-size:26px; margin:0 0 6px; }
  p.sub { color:var(--sub); margin:0 0 28px; font-size:14px; }
  a.card { display:block; background:var(--card); border-radius:18px; padding:20px; margin-bottom:14px; text-decoration:none; color:inherit; border:1px solid rgba(128,128,128,.15); }
  a.card:hover { border-color: var(--accent); }
  .card-title { font-weight:700; font-size:16px; margin-bottom:4px; }
  .card-desc { font-size:13px; color:var(--sub); line-height:1.4; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>GeniqCare</h1>
    <p class="sub">Two installable apps built in this repo.</p>
    <a class="card" href="./geniqcare-app/">
      <div class="card-title">GeniqCare — Health Companion</div>
      <div class="card-desc">Bilingual (EN / FR-CA) onboarding, dosage tracking, supplement catalog, micronutrient tracker, and AI-assisted consultation booking.</div>
    </a>
    <a class="card" href="./webapp/">
      <div class="card-title">Biogenique — Store</div>
      <div class="card-desc">Browse and shop Biogenique's real product catalog.</div>
    </a>
  </div>
</body>
</html>
