name: Deploy GeniqCare apps to GitHub Pages

on:
  push:
    branches: ["claude/biogenique-apk-download-9obfd9", "claude/catechism-app-search-commentaries-4ob9na"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble site
        run: |
          mkdir -p site
          cp landing/index.html site/index.html
          cp -r webapp site/webapp
          cp -r geniqcare-app site/geniqcare-app
          cp -r catechism-app site/catechism-app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'
      - id: deployment
        uses: actions/deploy-pages@v4
